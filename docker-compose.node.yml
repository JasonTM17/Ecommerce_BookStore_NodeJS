services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookstore_node
      POSTGRES_USER: bookstore_node
      POSTGRES_PASSWORD: ${NODE_DB_PASSWORD:?Set a private NODE_DB_PASSWORD}
    volumes:
      - node_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bookstore_node -d bookstore_node']
      interval: 5s
      timeout: 5s
      retries: 20
  backend-node:
    build:
      context: .
      dockerfile: Dockerfile.node
    environment:
      NODE_ENV: production
      PORT: '8080'
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: bookstore_node
      DB_USERNAME: bookstore_node
      DB_PASSWORD: ${NODE_DB_PASSWORD:?Set a private NODE_DB_PASSWORD}
      # Disposable local database only. Never reuse this setting for live data.
      DB_SYNCHRONIZE: 'true'
      JWT_SECRET: ${NODE_JWT_SECRET:?Set a private NODE_JWT_SECRET of at least 32 bytes}
      CORS_ORIGINS: http://localhost:3008,http://127.0.0.1:3008
      APP_BASE_URL: http://localhost:8088
      UPLOAD_DIR: /app/uploads
      APP_DEMO_SEED_ENABLED: 'false'
      GROK_ENABLED: 'false'
    ports:
      - '127.0.0.1:8088:8080'
    volumes:
      - node_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        API_PROXY_TARGET: http://backend-node:8080/api
    environment:
      NEXT_PUBLIC_API_URL: /api
      API_PROXY_TARGET: http://backend-node:8080/api
      BACKEND_HOSTPORT: backend-node:8080
      PORT: '3000'
    ports:
      - '127.0.0.1:3008:3000'
    depends_on:
      backend-node:
        condition: service_healthy
volumes:
  node_postgres:
  node_uploads:
